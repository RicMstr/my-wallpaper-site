<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的壁纸站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f5f5f5; font-family: sans-serif; padding: 20px; }
        h1 { text-align: center; margin-bottom: 30px; color: #333; }
        .wallpaper-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .wallpaper-item {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .wallpaper-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
        .wallpaper-item p {
            text-align: center;
            padding: 10px;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>我的壁纸站</h1>
    <div class="wallpaper-grid">
        <!-- 把下面的图片链接换成你自己的壁纸 -->
        <div class="wallpaper-item">
            <img src="wallpaper1.jpg" alt="壁纸1">
            <p>壁纸1</p>
        </div>
        <div class="wallpaper-item">
            <img src="wallpaper2.jpg" alt="壁纸2">
            <p>壁纸2</p>
        </div>
    </div>
</body>
</html>
